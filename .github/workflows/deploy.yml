name: Deploy to Cloudflare Workers

# Deploy only once CI (format, type-check, tests, build) has passed on main.
# Manual runs stay available for redeploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; queued runs wait rather than cancel so every
# deploy completes.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    # Only successful CI runs for pushes count: `branches` matches the head
    # branch, so a pull request from a fork's own `main` would match too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://eayltaskmaster.co.uk
    steps:
      # Deploy exactly the commit CI tested, not whatever main is now.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages render on request, so the build needs no database access.
      - name: Build
        run: npm run build

      # Deploys the generated Worker (dist/server/wrangler.json) and syncs the
      # runtime secrets it reads per request from the GitHub secrets below.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            DATABASE_URL
            NEON_AUTH_BASE_URL
            NEON_AUTH_COOKIE_SECRET
            AWS_ENDPOINT_URL_S3
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
        env:
          # Production Neon branch: pooled connection string and Auth URL.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          # 32+ random characters (`openssl rand -base64 32`).
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          # Production Object Storage (submission photos): the branch endpoint
          # and a storage:read + storage:write credential.
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
