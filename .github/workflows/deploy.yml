name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; queued runs wait rather than cancel so every
# deploy completes.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.eayltaskmaster.co.uk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages render on request, so the build needs no database access.
      - name: Build
        run: npm run build

      # Deploys the generated Worker (dist/server/wrangler.json) and syncs the
      # runtime secrets it reads per request from the GitHub secrets below.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
          secrets: |
            DATABASE_URL
            NEON_AUTH_BASE_URL
            NEON_AUTH_COOKIE_SECRET
        env:
          # Production Neon branch: pooled connection string and Auth URL.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          # 32+ random characters (`openssl rand -base64 32`).
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
